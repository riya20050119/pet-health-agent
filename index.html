<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5EC8B6">
<title>宠医智伴 - AI宠物健康顾问</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
*:focus{outline:none}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;background:linear-gradient(180deg,#E8F7F3 0%,#FFF5F0 40%,#F5F0FA 100%);background-attachment:fixed;color:#3D4A3D;line-height:1.5;overflow-x:hidden;min-height:100vh}
button{border:none;background:none;cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
img{max-width:100%;display:block}
:root{
  --primary:#5EC8B6;--primary-light:#8DD9CC;--primary-dark:#4AAB98;--primary-bg:#E8F7F3;
  --accent:#FF9E7A;--accent-light:#FFB89E;--accent-bg:#FFF0EB;
  --lilac:#B8A4D4;--lilac-bg:#F3EDF9;
  --warm:#FFD56B;--warm-bg:#FFF8E8;
  --danger:#FF6B6B;--danger-bg:#FFE8E8;
  --success:#6BCF7F;--success-bg:#E8F8EC;
  --bg:transparent;--card-bg:#fff;--text:#3D4A3D;--text-secondary:#7A8A7A;--text-hint:#AAB5AA;
  --border:#EDE8E0;--shadow:0 2px 12px rgba(94,200,182,.08);--shadow-hover:0 4px 20px rgba(94,200,182,.15);
  --radius:16px;--radius-sm:12px;--radius-lg:24px;--radius-pill:99px
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.04)}
.app-header{background:linear-gradient(135deg,#5EC8B6,#7DD8C8);padding:14px 18px;flex-shrink:0;position:sticky;top:0;z-index:100;border-radius:0 0 24px 24px}
.header-content{display:flex;align-items:center;justify-content:space-between}
.app-title{color:#fff;font-size:19px;font-weight:700;letter-spacing:.5px}
.icon-btn{color:#fff;font-size:22px;padding:6px 10px;opacity:.9;border-radius:var(--radius-pill);transition:background .2s}
.icon-btn:active{background:rgba(255,255,255,.2)}
.app-main{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.page{display:none;animation:fadeInUp .3s ease}
.page.active{display:block}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-inner{padding:16px;padding-bottom:90px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:4px}
.section-header h2{font-size:17px;font-weight:700;color:var(--text)}
.btn-text{color:var(--primary);font-size:14px;font-weight:600;padding:6px 12px;border-radius:var(--radius-pill);background:var(--primary-bg);transition:all .2s}
.btn-text:active{transform:scale(.95)}

/* Pet cards */
.pet-list{display:flex;flex-direction:column;gap:10px}
.pet-card{background:var(--card-bg);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:all .2s;border:2px solid transparent}
.pet-card:active{transform:scale(.98)}
.pet-card.selected{border-color:var(--primary)}
.pet-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.pet-info{flex:1}
.pet-info .name{font-size:15px;font-weight:600}
.pet-info .meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.pet-status{font-size:11px;padding:4px 12px;border-radius:var(--radius-pill);font-weight:600}
.pet-status.healthy{background:var(--success-bg);color:var(--success)}
.pet-status.warning{background:var(--accent-bg);color:var(--accent)}
.pet-status.danger{background:var(--danger-bg);color:var(--danger)}
.pet-card-actions{display:flex;gap:4px;margin-left:8px}
.pet-card-actions button{font-size:16px;padding:4px 6px;opacity:.5;border-radius:8px}
.pet-card-actions button:active{opacity:1}

/* Quick actions */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-card{background:var(--card-bg);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);transition:all .2s}
.qa-card:active{transform:scale(.96);box-shadow:var(--shadow-hover)}
.qa-icon{font-size:30px;display:block;margin-bottom:8px}
.qa-label{font-size:13px;color:var(--text-secondary);font-weight:500}
.qa-card:nth-child(1) .qa-icon{filter:hue-rotate(0deg)}
.qa-card:nth-child(2){background:linear-gradient(135deg,#FFF0EB,#fff)}
.qa-card:nth-child(3){background:linear-gradient(135deg,#F3EDF9,#fff)}
.qa-card:nth-child(4){background:linear-gradient(135deg,#E8F7F3,#fff)}

/* Reminders */
.reminder-list{display:flex;flex-direction:column;gap:8px}
.reminder-card{background:var(--accent-bg);border-radius:var(--radius-sm);padding:12px 14px;border-left:3px solid var(--accent);display:flex;align-items:center;gap:10px;transition:all .2s}
.reminder-card:active{transform:translateX(2px)}
.reminder-card .icon{font-size:20px}
.reminder-card .info{flex:1}
.reminder-card .title{font-size:13px;font-weight:600;color:#D6744A}
.reminder-card .desc{font-size:12px;color:#C49A80;margin-top:1px}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-hint)}
.empty-state p{font-size:14px;margin-bottom:4px}
.empty-state .empty-icon{font-size:40px;display:block;margin-bottom:12px;opacity:.6}

/* Chat */
.chat-page{display:flex;flex-direction:column;height:calc(100vh - 140px);padding:0}
.chat-header{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card-bg)}
.chat-pet-info{font-size:13px;color:var(--text-secondary);text-align:center}
.chat-pet-info .selected{color:var(--primary);font-weight:600}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chat-welcome{text-align:center;padding:40px 20px;color:var(--text-hint)}
.chat-welcome-icon{font-size:44px;display:block;margin-bottom:12px}
.chat-welcome p{font-size:14px;margin-bottom:6px}
.chat-welcome-hint{font-size:12px;color:var(--text-hint)}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.ai{background:var(--card-bg);color:var(--text);align-self:flex-start;border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.msg.user{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.system{align-self:center;background:var(--primary-bg);color:var(--primary-dark);font-size:12px;border-radius:var(--radius-pill);padding:4px 14px}
.msg img{max-width:200px;border-radius:10px;margin-top:6px}
.msg .diagnosis-block{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.06)}
.msg .diagnosis-block .label{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.msg .diagnosis-block .severity{display:inline-block;font-size:11px;padding:3px 12px;border-radius:var(--radius-pill);margin-bottom:6px}
.severity.urgent{background:var(--danger-bg);color:var(--danger)}
.severity.soon{background:var(--accent-bg);color:var(--accent)}
.severity.observe{background:var(--success-bg);color:var(--success)}
.msg .hospital-btn,.msg .diet-btn{display:inline-block;margin-top:8px;padding:8px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;transition:transform .15s}
.msg .hospital-btn{background:var(--primary);color:#fff}
.msg .diet-btn{background:var(--accent);color:#fff;margin-left:6px}
.msg .hospital-btn:active,.msg .diet-btn:active{transform:scale(.95)}
.chat-input-area{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--card-bg)}
.chat-photo-btn{font-size:24px;padding:6px;flex-shrink:0;border-radius:50%;transition:background .2s}
.chat-photo-btn:active{background:var(--primary-bg)}
.chat-input-wrap{flex:1}
.chat-input{width:100%;border:2px solid var(--border);border-radius:var(--radius-pill);padding:8px 16px;font-size:14px;resize:none;max-height:100px;line-height:1.4;background:var(--bg);transition:border-color .2s}
.chat-input:focus{border-color:var(--primary)}
.chat-send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.chat-send-btn:disabled{opacity:.4}
.chat-send-btn:active{transform:scale(.92)}

/* Diet calendar */
.calendar-wrap{background:var(--card-bg);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav .month-label{font-size:17px;font-weight:700;color:var(--text)}
.cal-nav button{font-size:18px;color:var(--primary);padding:4px 10px;border-radius:var(--radius-pill);transition:background .2s}
.cal-nav button:active{background:var(--primary-bg)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-weekdays span{text-align:center;font-size:11px;color:var(--text-hint);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:13px;position:relative;transition:all .15s;cursor:pointer}
.cal-day.empty{cursor:default}
.cal-day.other{color:var(--text-hint);opacity:.4}
.cal-day.today{background:var(--primary-bg);color:var(--primary-dark);font-weight:700}
.cal-day.selected{background:var(--primary);color:#fff;font-weight:700}
.cal-day.has-record::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:4px}
.cal-day.selected.has-record::after{background:#fff}
.cal-day.has-photo::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--lilac);position:absolute;top:4px}
.cal-day.selected.has-photo::before{background:#fff}

.feed-day-panel{margin-bottom:14px}
.feed-day-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.feed-day-title .badge{font-size:11px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--primary-bg);color:var(--primary);font-weight:600}
.feed-records{display:flex;flex-direction:column;gap:8px}
.feed-record{background:var(--card-bg);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;transition:all .2s}
.feed-record:active{transform:scale(.98)}
.feed-record img{width:56px;height:56px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--bg)}
.feed-record .feed-info{flex:1}
.feed-record .feed-time{font-size:12px;color:var(--text-hint)}
.feed-record .feed-food{font-size:14px;font-weight:600;margin-top:2px}
.feed-record .feed-nutri{font-size:11px;color:var(--text-secondary);margin-top:4px;display:flex;gap:8px}
.feed-record .feed-nutri span{background:var(--primary-bg);padding:2px 8px;border-radius:var(--radius-pill);color:var(--primary-dark)}
.feed-record .del-btn{font-size:16px;opacity:.4;align-self:center;padding:4px}
.feed-record .del-btn:active{opacity:1;color:var(--danger)}
.nutri-summary{background:linear-gradient(135deg,var(--primary-bg),#fff);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.nutri-summary h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--text)}
.nutri-bars{display:flex;flex-direction:column;gap:8px}
.nutri-bar{display:flex;align-items:center;gap:8px}
.nutri-bar .label{font-size:12px;color:var(--text-secondary);width:50px;flex-shrink:0}
.nutri-bar .bar{flex:1;height:8px;border-radius:4px;background:#EDEDEE;overflow:hidden}
.nutri-bar .fill{height:100%;border-radius:4px;transition:width .5s ease}
.nutri-bar .val{font-size:12px;font-weight:600;color:var(--text);width:50px;text-align:right}
.add-feed-btn{position:fixed;right:20px;bottom:90px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(94,200,182,.4);z-index:50;transition:transform .2s}
.add-feed-btn:active{transform:scale(.9)}

/* Growth album */
.album-timeline{display:flex;flex-direction:column;gap:16px}
.album-entry{display:flex;gap:12px}
.album-date-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:50px}
.album-date-col .age-tag{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.album-date-col .date-circle{width:36px;height:36px;border-radius:50%;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary-dark);flex-shrink:0}
.album-date-col .line{flex:1;width:2px;background:var(--border);margin-top:4px;min-height:20px}
.album-content{flex:1;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.album-photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg)}
.album-meta{padding:10px 14px}
.album-meta .weight{font-size:15px;font-weight:700;color:var(--primary)}
.album-meta .note{font-size:13px;color:var(--text-secondary);margin-top:2px}
.album-meta .date{font-size:11px;color:var(--text-hint);margin-top:4px}
.album-empty{text-align:center;padding:60px 20px}
.album-empty .icon{font-size:48px;opacity:.4;margin-bottom:12px}

/* Diet plan cards */
.diet-content{display:flex;flex-direction:column;gap:12px}
.diet-summary{background:linear-gradient(135deg,var(--primary-bg),#fff);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:center}
.diet-calorie{font-size:36px;font-weight:700;color:var(--primary)}
.diet-calorie .unit{font-size:16px;color:var(--text-hint);font-weight:400}
.diet-calorie-label{font-size:13px;color:var(--text-secondary);margin-top:2px}
.diet-warning{background:var(--accent-bg);border-radius:var(--radius-sm);padding:10px;margin-top:10px;font-size:13px;color:#D6744A;border-left:3px solid var(--accent);text-align:left}
.meal-card{background:var(--card-bg);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:all .2s}
.meal-card:active{transform:scale(.99)}
.meal-time{font-size:14px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:4px}
.meal-content{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.6}
.meal-adjustment{font-size:12px;color:var(--accent);margin-top:6px;background:var(--accent-bg);padding:4px 10px;border-radius:8px}
.forbidden-list{background:var(--danger-bg);border-radius:var(--radius);padding:14px}
.forbidden-list h4{font-size:14px;color:var(--danger);margin-bottom:6px}
.forbidden-list .items{font-size:13px;color:#c62828;line-height:1.8}

/* Health tabs */
.health-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--border)}
.health-tab{flex:1;padding:8px;text-align:center;font-size:14px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;transition:all .2s}
.health-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.record-list,.history-list{display:flex;flex-direction:column;gap:8px}
.record-card,.history-card{background:var(--card-bg);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;transition:all .2s}
.record-card:active{transform:scale(.99)}
.record-card .icon{font-size:22px;flex-shrink:0}
.record-card .info{flex:1}
.record-card .info .name{font-size:14px;font-weight:600}
.record-card .info .meta{font-size:12px;color:var(--text-hint);margin-top:1px}
.record-card .info .note{font-size:12px;color:var(--text-secondary);margin-top:2px}
.history-card .date{font-size:12px;color:var(--text-hint)}
.history-card .summary{font-size:13px;color:var(--text);margin-top:4px;line-height:1.5}
.history-card .severity-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:var(--radius-pill);margin-top:4px}
.weight-chart{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}

/* Bottom nav */
.bottom-nav{display:flex;background:var(--card-bg);border-top:1px solid var(--border);padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0));flex-shrink:0}
.nav-item{flex:1;text-align:center;padding:4px;color:var(--text-hint);transition:color .2s;position:relative}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:21px;display:block}
.nav-label{font-size:10px;margin-top:2px;font-weight:500}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{font-size:20px;color:var(--text-hint);padding:4px 8px;border-radius:50%}
.modal-close:active{background:var(--bg)}
.modal-body{flex:1;overflow-y:auto;padding:16px}
.modal-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);padding-bottom:calc(12px + env(safe-area-inset-bottom,0))}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.label-hint{font-weight:400;font-size:12px;color:var(--text-hint)}
.form-input{width:100%;border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;background:var(--bg);transition:border-color .2s}
.form-input:focus{border-color:var(--primary);background:#fff}
.form-hint{font-size:12px;color:var(--text-hint);margin-top:4px}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
textarea.form-input{resize:vertical;min-height:60px}
.option-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.option-item{text-align:center;padding:10px 4px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);transition:all .15s}
.option-item .emoji{font-size:20px;display:block;margin-bottom:2px}
.option-item.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.btn-primary{flex:1;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius-sm);padding:12px;font-size:15px;font-weight:600;transition:transform .15s}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{flex:1;background:#f0f0f0;color:var(--text-secondary);border-radius:var(--radius-sm);padding:12px;font-size:15px;font-weight:600}
.hospital-list,.product-list{display:flex;flex-direction:column;gap:8px}
.hospital-card,.product-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border)}
.hospital-card .name{font-size:14px;font-weight:600;color:var(--text)}
.hospital-card .address{font-size:12px;color:var(--text-secondary);margin-top:2px}
.hospital-card .meta{display:flex;gap:12px;margin-top:6px}
.hospital-card .meta span{font-size:12px;color:var(--text-hint)}
.hospital-card .nav-link{display:inline-block;margin-top:6px;font-size:13px;color:var(--primary);font-weight:600}
.hospital-search-status,.loading-state{text-align:center;padding:20px;color:var(--text-hint);font-size:14px}
.product-card .product-name{font-size:14px;font-weight:600}
.product-card .product-reason{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.5}
.product-card .product-price{font-size:13px;color:var(--accent);font-weight:600;margin-top:4px}
.product-card .product-tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--primary-bg);color:var(--primary);margin-top:6px}

/* Toast & Loading */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(45,60,50,.92);color:#fff;padding:10px 24px;border-radius:var(--radius-pill);font-size:14px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
.loading-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1500;align-items:center;justify-content:center;flex-direction:column}
.loading-overlay.active{display:flex}
.loading-spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#fff;font-size:14px;margin-top:12px}
.typing-indicator{display:flex;gap:4px;align-items:center;padding:8px 4px}
.typing-indicator span{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:bounce 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Photo upload preview */
.photo-preview{width:80px;height:80px;border-radius:var(--radius-sm);object-fit:cover;margin-top:8px}
.photo-upload-btn{display:flex;align-items:center;justify-content:center;width:80px;height:80px;border:2px dashed var(--border);border-radius:var(--radius-sm);font-size:28px;color:var(--text-hint);transition:all .2s}
.photo-upload-btn:active{border-color:var(--primary);color:var(--primary)}

@media(min-width:481px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">🐾 宠医智伴</h1>

    </div>
  </header>
  <main class="app-main">
    <!-- Dashboard -->
    <section class="page active" id="page-dashboard">
      <div class="page-inner">
        <div class="section-header"><h2>我的宠物</h2><button class="btn-text" id="btn-add-pet">+ 添加</button></div>
        <div class="pet-list" id="pet-list"></div>
        <div class="section-header" style="margin-top:18px"><h2>快捷功能</h2></div>
        <div class="quick-actions">
          <button class="qa-card" data-page="consultation"><span class="qa-icon">🩺</span><span class="qa-label">AI问诊</span></button>
          <button class="qa-card" data-page="calendar"><span class="qa-icon">🍽️</span><span class="qa-label">饮食方案</span></button>
          <button class="qa-card" id="qa-products"><span class="qa-icon">🛒</span><span class="qa-label">产品推荐</span></button>
          <button class="qa-card" id="qa-hospital"><span class="qa-icon">🏥</span><span class="qa-label">附近医院</span></button>
        </div>
        <div class="section-header" style="margin-top:18px"><h2>健康提醒</h2></div>
        <div class="reminder-list" id="reminder-list"><div class="empty-state">暂无提醒</div></div>
      </div>
    </section>
    <!-- Consultation -->
    <section class="page" id="page-consultation">
      <div class="page-inner chat-page">
        <div class="chat-header"><div class="chat-pet-info" id="chat-pet-info">请先选择宠物</div></div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-welcome"><span class="chat-welcome-icon">🩺</span><p>选择宠物后，描述你观察到的症状，AI会帮你初步分析</p><p class="chat-welcome-hint">比如：猫咪最近喝水多、尿多、体重下降</p></div>
        </div>
        <div class="chat-input-area">
          <button class="chat-photo-btn" id="chat-photo-btn" title="上传照片">📷</button>
          <input type="file" id="chat-photo-input" accept="image/*" style="display:none">
          <div class="chat-input-wrap"><textarea class="chat-input" id="chat-input" placeholder="描述宠物症状..." rows="1"></textarea></div>
          <button class="chat-send-btn" id="chat-send" title="发送">↑</button>
        </div>
      </div>
    </section>
    <!-- Diet Calendar -->
    <section class="page" id="page-calendar">
      <div class="page-inner">
        <div class="section-header"><h2>喂食日历</h2><button class="btn-text" id="btn-gen-diet">生成方案</button></div>
        <div id="diet-empty-state" style="display:none"></div>
        <div class="calendar-wrap" id="calendar-wrap"></div>
        <div class="nutri-summary" id="nutri-summary" style="display:none"></div>
        <div class="feed-day-panel" id="feed-day-panel"></div>
      </div>
    </section>
    <!-- Growth Album -->
    <section class="page" id="page-album">
      <div class="page-inner">
        <div class="section-header"><h2>成长相册</h2><button class="btn-text" id="btn-add-photo">+ 记录</button></div>
        <div class="album-timeline" id="album-timeline"></div>
      </div>
    </section>
    <!-- Health Records -->
    <section class="page" id="page-health">
      <div class="page-inner">
        <div class="section-header"><h2>健康档案</h2><div style="display:flex;gap:8px"><button class="btn-text" id="btn-visit" onclick="window.VisitRecord&&window.VisitRecord.openModal()" style="color:var(--primary);padding:6px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--primary-bg)">📋 拍病历</button><button class="btn-text" id="btn-add-record">+ 记录</button></div></div>
        <div class="health-tabs">
          <button class="health-tab active" data-tab="records">健康记录</button>
          <button class="health-tab" data-tab="history">问诊历史</button>
          <button class="health-tab" data-tab="weight">体重趋势</button>
        </div>
        <div class="health-tab-content" id="health-records-tab"><div class="record-list" id="record-list"><div class="empty-state">暂无记录</div></div></div>
        <div class="health-tab-content" id="health-history-tab" style="display:none"><div class="history-list" id="history-list"><div class="empty-state">暂无问诊记录</div></div></div>
        <div class="health-tab-content" id="health-weight-tab" style="display:none"><div class="weight-chart" id="weight-chart"><div class="empty-state">暂无体重数据</div></div></div>

  <nav class="bottom-nav">

    <button class="nav-item" data-page="health"><span class="nav-icon">📋</span><span class="nav-label">档案</span></button>

    <div class="modal">
      <div class="modal-header"><h3 id="pet-edit-title">添加宠物</h3><button class="modal-close" data-close="modal-pet-edit">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label>名称</label><input type="text" class="form-input" id="pet-name" placeholder="如：小橘"></div>
        <div class="form-group"><label>宠物类型</label><div class="option-grid" id="pet-type-grid"></div></div>
        <div class="form-group"><label>品种</label><input type="text" class="form-input" id="pet-breed" placeholder="如：橘猫、金毛、荷兰兔"></div>

    </div>
  </div>

  <!-- Modal: Add Record -->
  <div class="modal-overlay" id="modal-record">
    <div class="modal">
      <div class="modal-header"><h3>添加健康记录</h3><button class="modal-close" data-close="modal-record">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label>记录类型</label><select class="form-input" id="record-type"><option value="vaccine">疫苗</option><option value="deworm">驱虫</option><option value="exam">体检</option><option value="weight">体重</option><option value="visit">就诊</option></select></div>
        <div class="form-group"><label>日期</label><input type="date" class="form-input" id="record-date"></div>
        <div class="form-group" id="record-name-group"><label>名称</label><input type="text" class="form-input" id="record-name" placeholder="如：狂犬疫苗、体外驱虫"></div>
        <div class="form-group" id="record-next-group"><label>下次日期(可选)</label><input type="date" class="form-input" id="record-next-date"></div>
        <div class="form-group" id="record-weight-group" style="display:none"><label>体重(kg)</label><input type="number" class="form-input" id="record-weight" step="0.1" placeholder="4.5"></div>

    </div>

  <!-- Modal: Visit Record (拍病历) -->

    <div class="modal" style="max-width:420px">
      <div class="modal-header"><h3>📋 拍病历录入</h3><button class="modal-close" data-close="modal-visit">✕</button></div>

        <div class="form-group"><button class="btn-primary" id="btn-scan-visit" onclick="window.VisitRecord&&window.VisitRecord.scan()" style="width:100%;padding:12px">🤖 AI扫描病历</button></div>
        <div id="visit-scan-status" style="display:none;padding:10px;border-radius:8px;background:var(--primary-bg);font-size:13px;text-align:center;margin-bottom:12px"></div>
        <div class="form-group"><label>就诊日期</label><input type="date" class="form-input" id="visit-date"></div>
        <div class="form-group"><label>就诊医院</label><input type="text" class="form-input" id="visit-hospital" placeholder="如：瑞鹏宠物医院"></div>
        <div class="form-group"><label>诊断结果</label><textarea class="form-input" id="visit-diagnosis" rows="2" placeholder="如：上呼吸道感染"></textarea></div>

        <div class="form-group"><label>医嘱/注意事项</label><textarea class="form-input" id="visit-advice" rows="2" placeholder="如：7天后复诊、忌食油腻"></textarea></div>
        <div class="form-group"><label>复诊日期(可选)</label><input type="date" class="form-input" id="visit-next-date"></div>
        <div class="form-group"><label>本次体重(kg)(可选)</label><input type="number" class="form-input" id="visit-weight" step="0.1" placeholder="4.5"></div>
      </div>
      <div class="modal-footer"><button class="btn-secondary" data-close="modal-visit">取消</button><button class="btn-primary" id="btn-save-visit" onclick="window.VisitRecord&&window.VisitRecord.save()">保存就诊记录</button></div>
    </div>
  </div>

  <!-- Modal: Add Feed -->
  <div class="modal-overlay" id="modal-feed">
    <div class="modal">
      <div class="modal-header"><h3>记录喂食</h3><button class="modal-close" data-close="modal-feed">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label>日期</label><input type="date" class="form-input" id="feed-date"></div>
        <div class="form-row">
          <div class="form-group"><label>时间</label><input type="time" class="form-input" id="feed-time"></div>
          <div class="form-group"><label>餐次</label><select class="form-input" id="feed-meal"><option value="morning">早餐</option><option value="noon">午餐</option><option value="evening">晚餐</option><option value="snack">加餐</option></select></div>
        </div>
        <div class="form-group"><label>食物内容</label><textarea class="form-input" id="feed-food" rows="2" placeholder="如：鸡胸肉30g + 皇家猫粮20g"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>卡路里(kcal)</label><input type="number" class="form-input" id="feed-calories" placeholder="120" step="1"></div>
          <div class="form-group"><label>蛋白质(g)</label><input type="number" class="form-input" id="feed-protein" placeholder="15" step="0.1"></div>
        </div>
        <div class="form-group"><label>拍照记录</label><input type="file" id="feed-photo-input" accept="image/*" style="display:none"><div class="photo-upload-btn" id="feed-photo-btn">📷</div><img class="photo-preview" id="feed-photo-preview" style="display:none"></div>
        <div class="form-group"><label>备注</label><input type="text" class="form-input" id="feed-note" placeholder="如：吃得很快/剩了一些"></div>
      </div>
      <div class="modal-footer"><button class="btn-secondary" data-close="modal-feed">取消</button><button class="btn-primary" id="btn-save-feed">保存</button></div>
    </div>
  </div>

  <!-- Modal: Add Album Photo -->
  <div class="modal-overlay" id="modal-album">
    <div class="modal">
      <div class="modal-header"><h3>成长记录</h3><button class="modal-close" data-close="modal-album">✕</button></div>
      <div class="modal-body">
        <div class="form-group"><label>拍照/上传</label><input type="file" id="album-photo-input" accept="image/*" style="display:none"><div class="photo-upload-btn" id="album-photo-btn">📷</div><img class="photo-preview" id="album-photo-preview" style="display:none"></div>
        <div class="form-group"><label>日期</label><input type="date" class="form-input" id="album-date"></div>
        <div class="form-group"><label>体重(kg)</label><input type="number" class="form-input" id="album-weight" placeholder="4.5" step="0.1"></div>
        <div class="form-group"><label>成长笔记</label><textarea class="form-input" id="album-note" rows="2" placeholder="如：今天带小橘去打了疫苗，表现很勇敢！"></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn-secondary" data-close="modal-album">取消</button><button class="btn-primary" id="btn-save-album">保存</button></div>
    </div>
  </div>

  <!-- Modal: Hospital -->
  <div class="modal-overlay" id="modal-hospital">
    <div class="modal">
      <div class="modal-header"><h3>附近宠物医院</h3><button class="modal-close" data-close="modal-hospital">✕</button></div>
      <div class="modal-body"><div class="hospital-search-status" id="hospital-status"><p>点击下方按钮，搜索你附近的宠物医院</p></div><div class="hospital-list" id="hospital-list"></div></div>
      <div class="modal-footer"><button class="btn-primary" id="btn-search-hospital">🔍 搜索附近医院</button></div>
    </div>
  </div>

  <!-- Modal: Products -->
  <div class="modal-overlay" id="modal-products">
    <div class="modal">
      <div class="modal-header"><h3>产品推荐</h3><button class="modal-close" data-close="modal-products">✕</button></div>
      <div class="modal-body"><div id="products-status" class="loading-state"><p>点击下方按钮，AI将根据宠物健康状态推荐合适产品</p></div><div class="product-list" id="product-list"></div></div>
      <div class="modal-footer"><button class="btn-primary" id="btn-generate-products">🛒 生成推荐</button></div>
    </div>
  </div>

  <!-- Modal: Diet Plan -->
  <div class="modal-overlay" id="modal-diet">
    <div class="modal">
      <div class="modal-header"><h3>每日饮食计划</h3><button class="modal-close" data-close="modal-diet">✕</button></div>
      <div class="modal-body" id="diet-modal-body"></div>
      <div class="modal-footer"><button class="btn-primary" data-close="modal-diet">完成</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loading-overlay"><div class="loading-spinner"></div><p class="loading-text" id="loading-text">AI思考中...</p></div>
  <button class="add-feed-btn" id="add-feed-fab" style="display:none">+</button>
</div>

<script>
// ====== CONFIG ======
const DASHSCOPE_API_KEY='sk-ws-H.PIIIIHR.Qcr7.MEUCIQCesyC0OO7C5HDtOezL-SnV4AAk1yKxuxEPCFyKd0j6iAIgWqmqA1Wcuxwdk2CfXnoVDmJ2xZ5B3FovRg7u1RGXnyQ';
const API_URL='https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';

// ====== STORE ======
const Store={
  KEYS:{PETS:'ph_pets',CURRENT_PET:'ph_current_pet',CONSULTATIONS:'ph_consultations',DIET_PLANS:'ph_diet_plans',HEALTH_RECORDS:'ph_health_records',PRODUCTS:'ph_products',FEED_RECORDS:'ph_feed_records',ALBUM_RECORDS:'ph_album_records'},
  _get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}},
  _set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.error(e)}},
  getPets(){return this._get(this.KEYS.PETS,[])},
  getPet(id){return this.getPets().find(p=>p.id===id)||null},
  savePet(p){const ps=this.getPets();const i=ps.findIndex(x=>x.id===p.id);if(i>=0)ps[i]=p;else ps.push(p);this._set(this.KEYS.PETS,ps)},
  deletePet(id){const ps=this.getPets().filter(p=>p.id!==id);this._set(this.KEYS.PETS,ps);if(this.getCurrentPetId()===id)this.setCurrentPetId(ps[0]?.id||null)},
  getCurrentPetId(){return this._get(this.KEYS.CURRENT_PET,null)},
  setCurrentPetId(id){this._set(this.KEYS.CURRENT_PET,id)},
  getCurrentPet(){const id=this.getCurrentPetId();return id?this.getPet(id):null},
  getConsultations(petId){const a=this._get(this.KEYS.CONSULTATIONS,[]);return petId?a.filter(c=>c.petId===petId):a},
  saveConsultation(c){const a=this._get(this.KEYS.CONSULTATIONS,[]);const i=a.findIndex(x=>x.id===c.id);if(i>=0)a[i]=c;else a.push(c);this._set(this.KEYS.CONSULTATIONS,a)},
  getLatestConsultation(petId){const l=this.getConsultations(petId);return l.length>0?l[l.length-1]:null},
  getDietPlans(petId){const a=this._get(this.KEYS.DIET_PLANS,[]);return petId?a.filter(d=>d.petId===petId):a},
  getLatestDietPlan(petId){const l=this.getDietPlans(petId);return l.length>0?l[l.length-1]:null},
  saveDietPlan(p){const a=this._get(this.KEYS.DIET_PLANS,[]);const i=a.findIndex(x=>x.id===p.id);if(i>=0)a[i]=p;else a.push(p);this._set(this.KEYS.DIET_PLANS,a)},
  getHealthRecords(petId){const a=this._get(this.KEYS.HEALTH_RECORDS,[]);return petId?a.filter(r=>r.petId===petId):a},
  saveHealthRecord(r){const a=this._get(this.KEYS.HEALTH_RECORDS,[]);const i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);this._set(this.KEYS.HEALTH_RECORDS,a)},
  deleteHealthRecord(id){const a=this._get(this.KEYS.HEALTH_RECORDS,[]).filter(r=>r.id!==id);this._set(this.KEYS.HEALTH_RECORDS,a)},
  getProducts(petId){const a=this._get(this.KEYS.PRODUCTS,[]);return petId?a.filter(p=>p.petId===petId):a},
  saveProducts(petId,products){const a=this._get(this.KEYS.PRODUCTS,[]);const i=a.findIndex(x=>x.petId===petId);const e={petId,products,savedAt:new Date().toISOString()};if(i>=0)a[i]=e;else a.push(e);this._set(this.KEYS.PRODUCTS,a)},
  getFeedRecords(petId){const a=this._get(this.KEYS.FEED_RECORDS,[]);return petId?a.filter(r=>r.petId===petId):a},
  getFeedRecordsByDate(petId,date){return this.getFeedRecords(petId).filter(r=>r.date===date)},
  saveFeedRecord(r){const a=this._get(this.KEYS.FEED_RECORDS,[]);const i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);this._set(this.KEYS.FEED_RECORDS,a)},
  deleteFeedRecord(id){const a=this._get(this.KEYS.FEED_RECORDS,[]).filter(r=>r.id!==id);this._set(this.KEYS.FEED_RECORDS,a)},
  getAlbumRecords(petId){const a=this._get(this.KEYS.ALBUM_RECORDS,[]);return petId?a.filter(r=>r.petId===petId).sort((a,b)=>b.date.localeCompare(a.date)):[]},
  saveAlbumRecord(r){const a=this._get(this.KEYS.ALBUM_RECORDS,[]);const i=a.findIndex(x=>x.id===r.id);if(i>=0)a[i]=r;else a.push(r);this._set(this.KEYS.ALBUM_RECORDS,a)},
  deleteAlbumRecord(id){const a=this._get(this.KEYS.ALBUM_RECORDS,[]).filter(r=>r.id!==id);this._set(this.KEYS.ALBUM_RECORDS,a)},
  genId(p='id'){return`${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`},
  formatDate(d){const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`},
  calcAge(b){if(!b)return'未知';const dt=new Date(b);const n=new Date();const m=(n.getFullYear()-dt.getFullYear())*12+(n.getMonth()-dt.getMonth());if(m<12)return m+'个月';const y=Math.floor(m/12);const r=m%12;return r>0?y+'岁'+r+'个月':y+'岁'}
};

// ====== API ======
const API={
  async chat(messages,model='qwen-plus'){
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${DASHSCOPE_API_KEY}`},body:JSON.stringify({model,messages,temperature:0.7,max_tokens:2048,stream:false})});
    if(!r.ok){const e=await r.text();throw new Error(`API错误(${r.status}): ${e.slice(0,200)}`)}
    const d=await r.json();return d.choices[0]?.message?.content||''
  },
  async chatWithSystem(sys,msgs){return await this.chat([{role:'system',content:sys},...msgs])},
  async analyzeImage(img,prompt){
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${DASHSCOPE_API_KEY}`},body:JSON.stringify({model:'qwen-vl-plus',messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:img.startsWith('data:')?img:`data:image/jpeg;base64,${img}`}}]}],temperature:0.6,max_tokens:1500})});
    if(!r.ok){const e=await r.text();throw new Error(`API错误(${r.status}): ${e.slice(0,200)}`)}
    const d=await r.json();return d.choices[0]?.message?.content||''
  },
  parseJSON(t){if(!t)return null;let c=t.trim();if(c.startsWith('```json'))c=c.replace(/^```json\s*/,'').replace(/```\s*$/,'');else if(c.startsWith('```'))c=c.replace(/^```\s*/,'').replace(/```\s*$/,'');try{return JSON.parse(c)}catch{const s=c.indexOf('{');const e=c.lastIndexOf('}');if(s>=0&&e>s){try{return JSON.parse(c.slice(s,e+1))}catch{}}const as=c.indexOf('[');const ae=c.lastIndexOf(']');if(as>=0&&ae>as){try{return JSON.parse(c.slice(as,ae+1))}catch{}}return null}},
  fileToBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
};

const Prompts={
  consultation(p){return`你是"宠医智伴"，一位专业、温和的宠物健康顾问AI。你正在为以下宠物进行问诊：\n\n宠物档案：\n${JSON.stringify(p,null,2)}\n\n问诊规则：\n1.模拟真实兽医问诊流程：主诉→追问现病史→鉴别诊断→建议\n2.每次只问1-2个问题\n3.语气亲切温和，称呼宠物名字\n4.如果用户上传了照片，分析可能的外观异常\n5.信息不足时继续追问，不要急于下结论\n6.症状较轻给居家护理建议，需要就医时明确告知\n\n收集到足够信息后，输出最终诊断分析，格式如下：\n\n【可能原因】\n1.xxx\n2.xxx\n3.xxx\n\n【严重程度】\n（🟢可观察|🟡建议就医|🔴紧急就医）\n\n【居家处理建议】\n-xxx\n\n【就医前准备】\n-xxx\n\n【健康调整因子】\n列出英文标识符，如：diabetes_risk,kidney_risk,obesity,food_allergy,urinary_issue,digestive_issue,skin_issue\n如无则写：none\n\n请用中文回复。`},
  image(p,desc){return`你是宠物健康顾问。请分析这张宠物照片。\n\n宠物信息：${p.name}，${p.type==='cat'?'猫':p.type==='dog'?'狗':p.type}，${p.breed||'品种未知'}，${Store.calcAge(p.birthDate)}，体重${p.weight||'未知'}kg\n\n用户描述：${desc||'无'}\n\n请观察是否有以下异常：皮肤红肿/脱毛/皮屑、眼睛分泌物/红肿、耳朵分泌物、口腔牙龈、毛发粗糙、体态消瘦或肥胖等。\n用简洁中文描述你观察到的，并给出初步判断。`},
  diet(p,c){const age=Store.calcAge(p.birthDate);const w=p.weight||4;const rer=Math.round(70*Math.pow(w,0.75));const factor=p.activity==='high'?1.6:p.activity==='low'?1.2:1.4;const dailyTarget=Math.round(rer*factor);const sp=p.type==='cat'?'猫':p.type==='dog'?'狗':p.type;return`你是"宠医智伴"的饮食方案引擎。请为以下宠物生成个性化每日饮食方案。\n\n宠物信息（已计算好，直接使用）：\n- 名称：${p.name}\n- 类型：${sp}\n- 品种：${p.breed||'未知'}\n- 年龄：${age}\n- 体重：${w}kg\n- 绝育：${p.neutered?'已绝育':'未绝育'}\n- 活动量：${p.activity||'medium'}\n- 既往病史：${p.medicalHistory||'无'}\n- 过敏史：${p.allergies||'无'}\n- 当前主粮：${p.currentDiet||'未知'}\n\n已计算好的热量数据（直接使用，不要重新计算）：\n- RER(静息能量需求) = 70 × ${w}^0.75 = ${rer} kcal/天\n- DER(每日能量需求) = RER × ${factor}(活动系数) = ${dailyTarget} kcal/天\n\n最近问诊结果：\n${c?JSON.stringify(c.diagnosis||c,null,2):'无最近问诊记录'}\n\n健康调整因子：${c?.diagnosis?.healthFactors?.join(', ')||'none'}\n\n请根据品种营养需求、年龄阶段、体重热量、健康调整因子生成方案。\n\n输出格式(JSON)：\n{"dailyCalorieTarget":${dailyTarget},"healthAdjustments":[{"factor":"diabetes_risk","adjustment":"碳水减少40%","reason":"糖尿病风险"}],"meals":[{"time":"08:00","food":"具体食物和份量(克数)","calories":数字(这顿的卡路里，两顿加起来应接近dailyCalorieTarget)","protein":数字(克),"adjustment":"调整说明或空"},{"time":"18:00","food":"具体食物和份量(克数)","calories":数字(这顿的卡路里，两顿加起来应接近dailyCalorieTarget)","protein":数字(克),"adjustment":"调整说明或空"}],"forbiddenFoods":["食物1","食物2"],"nutritionRatio":{"protein":数字,"fat":数字,"carbs":数字},"summary":"一句话总结"}\n\n规则：\n1.dailyCalorieTarget必须等于${dailyTarget}\n2.每顿的calories不能相同，要根据食物种类和份量计算\n3.两顿calories之和应接近dailyCalorieTarget\n4.蛋白质克数要根据食物实际蛋白质含量计算\n5.食物推荐要具体到品牌和克数\n6.有健康调整因子时每个meal的adjustment必须填写\n7.禁忌食物包含该物种常见禁忌\n只输出JSON。`},
  products(p,d,c){return`你是"宠医智伴"的产品推荐引擎。请根据宠物健康状况推荐产品。\n\n宠物档案：\n${JSON.stringify(p,null,2)}\n\n饮食方案：\n${d?JSON.stringify(d,null,2):'无'}\n\n健康状态：\n${c?.diagnosis?JSON.stringify(c.diagnosis,null,2):'无问诊记录'}\n\n推荐规则：1.基于饮食方案推荐粮食/零食/保健品 2.有健康问题自动过滤不适产品 3.每推荐含名称/理由/价格/适用说明 4.推荐3-5个\n\n输出格式(JSON数组)：\n[{"name":"名称","category":"主粮/零食/保健品","reason":"推荐理由","priceRange":"50-100元","suitableFor":"适用说明"}]\n\n只输出JSON。`},
  visitRecord(p){return`你是"宠医智伴"的病历识别引擎。请仔细识别这张宠物就诊单/病历/处方单的照片，提取关键信息。\n\n宠物信息：${p.name}，${p.type==='cat'?'猫':p.type==='dog'?'狗':p.type}，品种${p.breed||'未知'}\n\n请识别以下内容并输出JSON格式：\n{"date":"就诊日期(YYYY-MM-DD格式，识别不到则用今天)","hospital":"就诊医院名称","diagnosis":"诊断结果","medications":"用药/处方内容","advice":"医嘱和注意事项","nextDate":"复诊日期(YYYY-MM-DD格式，无则留空)","weight":"就诊时称量的体重(kg数字，无则留空)","healthUpdate":"需要更新到宠物既往病史的简要描述，如'确诊上呼吸道感染'或'确诊肠胃炎'，无则留空"}\n\n识别规则：\n1.仔细阅读手写或打印的文字\n2.日期统一转成YYYY-MM-DD\n3.药物名称、剂量要准确\n4.只输出JSON，不要输出其他文字`}
};

// ====== CONSULTATION ======
const Consultation={messages:[],currentId:null,isWaiting:false,pendingImage:null,
  init(){const inp=document.getElementById('chat-input');const send=document.getElementById('chat-send');const pb=document.getElementById('chat-photo-btn');const pi=document.getElementById('chat-photo-input');
    inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px'});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();this.send()}});
    send.addEventListener('click',()=>this.send());pb.addEventListener('click',()=>pi.click());pi.addEventListener('change',e=>this.handlePhoto(e))},
  checkAndStart(){const pet=Store.getCurrentPet();if(!pet){App.showToast('请先添加宠物');App.switchPage('dashboard');return false}
    if(this.messages.length===0)this.startNew();return true},
  startNew(){const pet=Store.getCurrentPet();this.messages=[];this.currentId=Store.genId('cons');const el=document.getElementById('chat-messages');
    el.innerHTML=`<div class="chat-welcome"><span class="chat-welcome-icon">🩺</span><p>已选择：<strong style="color:var(--primary)">${Profile.getEmoji(pet.type)} ${pet.name}</strong></p><p>描述你观察到的症状，AI会帮你初步分析</p><p class="chat-welcome-hint">比如：${this.getSuggestion(pet.type)}</p></div>`},
  getSuggestion(t){const s={cat:'猫咪最近喝水多、尿多、体重下降',dog:'狗狗一直挠耳朵、耳朵有味道',rabbit:'兔子最近不爱吃东西、粪便变小',hamster:'仓鼠精神不好、一直蜷缩不动',turtle:'乌龟壳上出现白色斑点'};return s[t]||'描述你观察到的异常情况'},
  async send(){if(this.isWaiting)return;const inp=document.getElementById('chat-input');const text=inp.value.trim();if(!text&&!this.pendingImage)return;if(!this.checkAndStart())return;
    this.isWaiting=true;document.getElementById('chat-send').disabled=true;
    let content=text;let imgResult=null;
    if(this.pendingImage){const pet=Store.getCurrentPet();App.showLoading('正在分析照片...');try{imgResult=await API.analyzeImage(this.pendingImage,Prompts.image(pet,text));content=`${text}\n[照片分析结果: ${imgResult}]`}catch(e){App.showToast('照片分析失败: '+e.message)}App.hideLoading()}
    this.messages.push({role:'user',content,image:this.pendingImage});inp.value='';inp.style.height='auto';this.pendingImage=null;document.getElementById('chat-photo-btn').textContent='📷';this.renderMessages();this.showTyping();
    const apiMsgs=this.messages.map(m=>({role:m.role,content:m.content}));const pet=Store.getCurrentPet();
    try{const reply=await API.chatWithSystem(Prompts.consultation(pet),apiMsgs);this.hideTyping();this.messages.push({role:'assistant',content:reply});const diag=this.parseDiagnosis(reply);if(diag)this.save(pet.id,reply,diag);this.renderMessages()}catch(e){this.hideTyping();App.showToast('AI请求失败: '+e.message)}finally{this.isWaiting=false;document.getElementById('chat-send').disabled=false}},
  async handlePhoto(e){const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){App.showToast('图片不能超过5MB');return}App.showLoading('处理图片...');this.pendingImage=await API.fileToBase64(f);App.hideLoading();document.getElementById('chat-photo-btn').textContent='✅';App.showToast('图片已添加，发送即可分析');e.target.value=''},
  parseDiagnosis(t){if(!t.includes('可能原因')&&!t.includes('严重程度'))return null;const sm=t.match(/严重程度[\s\S]*?(🟢|🟡|🔴|可观察|建议就医|紧急就医)/);const sev=sm?sm[1]:'';const cs=t.match(/可能原因[\s\S]*?(?=严重程度|健康调整因子|$)/);const causes=cs?cs[0].split('\n').filter(l=>/^\d/.test(l.trim())).map(l=>l.replace(/^\d+\.\s*/,'').trim()):[];const fm=t.match(/健康调整因子[\s\S]*$/);let hf=[];if(fm&&!fm[0].includes('none')){const known=['diabetes_risk','kidney_risk','obesity','food_allergy','urinary_issue','digestive_issue','skin_issue','dental_issue','eye_issue','ear_issue'];hf=known.filter(f=>fm[0].includes(f))}let sl='observe';if(sev.includes('🔴')||sev.includes('紧急'))sl='urgent';else if(sev.includes('🟡')||sev.includes('建议就医'))sl='soon';return{possibleCauses:causes,severity:sev.trim(),severityLevel:sl,healthFactors:hf,rawText:t}},

  typeConfig:{vaccine:{emoji:'💉',label:'疫苗'},deworm:{emoji:'🪱',label:'驱虫'},exam:{emoji:'🩺',label:'体检'},weight:{emoji:'⚖️',label:'体重'},visit:{emoji:'📋',label:'就诊'}},
  init(){document.getElementById('record-type').addEventListener('change',e=>{const w=e.target.value==='weight';document.getElementById('record-name-group').style.display=w?'none':'';document.getElementById('record-next-group').style.display=w?'none':'';document.getElementById('record-weight-group').style.display=w?'':'none'});
    document.querySelectorAll('.health-tab').forEach(t=>{t.addEventListener('click',()=>{document.querySelectorAll('.health-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('health-records-tab').style.display=t.dataset.tab==='records'?'':'none';document.getElementById('health-history-tab').style.display=t.dataset.tab==='history'?'':'none';document.getElementById('health-weight-tab').style.display=t.dataset.tab==='weight'?'':'none'})})},
  openAddModal(){const p=Store.getCurrentPet();if(!p){App.showToast('请先选择宠物');return}document.getElementById('record-type').value='vaccine';document.getElementById('record-date').value=Store.formatDate(new Date());document.getElementById('record-name').value='';document.getElementById('record-next-date').value='';document.getElementById('record-weight').value='';document.getElementById('record-note').value='';document.getElementById('record-name-group').style.display='';document.getElementById('record-next-group').style.display='';document.getElementById('record-weight-group').style.display='none';App.openModal('modal-record')},
  save(){const p=Store.getCurrentPet();if(!p)return;const type=document.getElementById('record-type').value;const date=document.getElementById('record-date').value;if(!date){App.showToast('请选择日期');return}
    const r={id:Store.genId('rec'),petId:p.id,type,date,name:document.getElementById('record-name').value.trim(),nextDate:document.getElementById('record-next-date').value||null,weight:document.getElementById('record-weight').value?parseFloat(document.getElementById('record-weight').value):null,note:document.getElementById('record-note').value.trim()};
    Store.saveHealthRecord(r);this.renderRecords();App.renderReminders();App.closeModal('modal-record');App.showToast('已保存')},
  renderRecords(){const p=Store.getCurrentPet();const l=document.getElementById('record-list');if(!p){l.innerHTML='<div class="empty-state">暂无记录</div>';return}
    const rs=Store.getHealthRecords(p.id).sort((a,b)=>b.date.localeCompare(a.date));if(rs.length===0){l.innerHTML='<div class="empty-state">暂无记录</div>';return}
    l.innerHTML=rs.map(r=>{const c=this.typeConfig[r.type]||{emoji:'📋',label:r.type};let mp=[r.date];if(r.nextDate)mp.push('下次: '+r.nextDate);if(r.weight)mp.push(r.weight+'kg');if(r.hospital)mp.push(r.hospital);
      let extra='';if(r.type==='visit'){if(r.diagnosis)extra+=`<div class="note" style="color:var(--primary);font-weight:500">诊断：${r.diagnosis}</div>`;if(r.medications)extra+=`<div class="note">用药：${r.medications}</div>`;if(r.advice)extra+=`<div class="note">医嘱：${r.advice}</div>`}else if(r.note)extra=`<div class="note">${r.note}</div>`;
      return`<div class="record-card"><div class="icon">${c.emoji}</div><div class="info"><div class="name">${r.name||c.label}</div><div class="meta">${mp.join(' · ')}</div>${extra}</div><button class="pet-delete-btn" data-record-id="${r.id}">🗑️</button></div>`}).join('');
    l.querySelectorAll('[data-record-id]').forEach(b=>{b.addEventListener('click',()=>{if(confirm('删除此记录？')){Store.deleteHealthRecord(b.dataset.recordId);this.renderRecords();App.renderReminders();App.showToast('已删除')}})})},
  renderHistory(){const p=Store.getCurrentPet();const l=document.getElementById('history-list');if(!p){l.innerHTML='<div class="empty-state">暂无记录</div>';return}
    const cs=Store.getConsultations(p.id).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));if(cs.length===0){l.innerHTML='<div class="empty-state">暂无问诊记录</div>';return}
    l.innerHTML=cs.map(c=>{const d=c.timestamp.slice(0,16).replace('T',' ');const dg=c.diagnosis;let sb='';if(dg){const cl=dg.severityLevel==='urgent'?'urgent':dg.severityLevel==='soon'?'soon':'observe';const lb=dg.severityLevel==='urgent'?'🔴 紧急就医':dg.severityLevel==='soon'?'🟡 建议就医':'🟢 可观察';sb=`<span class="severity-badge ${cl}">${lb}</span>`}const ca=dg?.possibleCauses?.join('、')||'无';return`<div class="history-card"><div class="date">${d}</div><div class="summary">可能原因：${ca}</div>${sb}</div>`}).join('')},
  renderWeightChart(){const p=Store.getCurrentPet();const c=document.getElementById('weight-chart');if(!p){c.innerHTML='<div class="empty-state">暂无体重数据</div>';return}
    const rs=Store.getHealthRecords(p.id).filter(r=>r.type==='weight'&&r.weight).sort((a,b)=>a.date.localeCompare(b.date));if(rs.length===0){c.innerHTML='<div class="empty-state">暂无体重数据<div><p style="font-size:13px;margin-top:8px;">在健康记录中添加体重记录即可看到趋势</p></div></div>';return}
    if(rs.length===1){c.innerHTML=`<div style="text-align:center;padding:20px;"><div style="font-size:32px;font-weight:700;color:var(--primary);">${rs[0].weight}<span style="font-size:16px;color:#999;"> kg</span></div><div style="font-size:13px;color:#999;margin-top:4px;">${rs[0].date}</div></div>`;return}
    const ws=rs.map(r=>r.weight),ds=rs.map(r=>r.date.slice(5));const mx=Math.max(...ws)*1.1,mn=Math.min(...ws)*0.9,rng=mx-mn||1;const W=300,H=150,pad=30,cw=W-pad*2,ch=H-pad*2;
    const pts=ws.map((w,i)=>({x:pad+(i/(ws.length-1))*cw,y:pad+ch-((w-mn)/rng)*ch,val:w}));const pd=pts.map((p,i)=>`${i===0?'M':'L'}${p.x},${p.y}`).join(' ');const ad=`${pd} L${pts[pts.length-1].x},${pad+ch} L${pts[0].x},${pad+ch} Z`;
    let lb=ds.map((d,i)=>{if(ds.length>6&&i%2!==0)return'';return`<text x="${pts[i].x}" y="${H-8}" text-anchor="middle" fill="#999" font-size="9">${d}</text>`}).join('');
    let dt=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#5EC8B6"/><text x="${p.x}" y="${p.y-6}" text-anchor="middle" fill="#5EC8B6" font-size="9">${p.val}kg</text>`).join('');
    c.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:200px;"><path d="${ad}" fill="rgba(94,200,182,0.1)"/><path d="${pd}" fill="none" stroke="#5EC8B6" stroke-width="2"/>${dt}${lb}</svg>`},
  renderAll(){this.renderRecords();this.renderHistory();this.renderWeightChart()},
  getReminders(){const ps=Store.getPets();const rs=[];const today=new Date();
    const inDays=d=>{if(!d)return null;return Math.ceil((new Date(d)-today)/(1000*60*60*24))};
    ps.forEach(p=>{Store.getHealthRecords(p.id).forEach(r=>{if(r.nextDate){const days=inDays(r.nextDate);if(days!==null&&days<=30){const c=this.typeConfig[r.type]||{emoji:'📋',label:'记录'};rs.push({petName:p.name,emoji:c.emoji,title:days<0?`${r.name||c.label}已到期`:`${r.name||c.label}还有${days}天到期`,desc:`${p.name} · ${r.nextDate}`,days})}}})});return rs.sort((a,b)=>a.days-b.days)}
};

// ====== VISIT RECORD (拍病历) ======
const VisitRecord={
  photoData:null,
  _bound:false,
  init(){
    if(this._bound)return;
    const btn=document.getElementById('visit-photo-btn');if(!btn)return;
    document.getElementById('visit-photo-btn').addEventListener('click',()=>document.getElementById('visit-photo-input').click());
    document.getElementById('visit-photo-input').addEventListener('change',e=>this.handlePhoto(e));
    document.getElementById('btn-scan-visit').addEventListener('click',()=>this.scan());
    document.getElementById('btn-save-visit').addEventListener('click',()=>this.save());
    this._bound=true;
  },
  openModal(){
    const VR=window.VisitRecord||this;
    const p=Store.getCurrentPet();if(!p){App.showToast('请先选择宠物');return}
    if(!VR._bound)VR.init();
    VR.photoData=null;
    const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val};
    const show=(id,s)=>{const el=document.getElementById(id);if(el)el.style.display=s};
    show('visit-photo-preview','none');show('visit-photo-btn','flex');
    set('visit-date',Store.formatDate(new Date()));
    set('visit-hospital','');set('visit-diagnosis','');set('visit-medications','');set('visit-advice','');
    set('visit-next-date','');set('visit-weight','');
    show('visit-scan-status','none');
    const mv=document.getElementById('modal-visit');if(mv)mv.classList.add('active');
    else console.error('modal-visit element not found');
  },
  async handlePhoto(e){
    const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){App.showToast('图片不能超过5MB');return}
    App.showLoading('处理图片...');this.photoData=await API.fileToBase64(f);App.hideLoading();
    const prev=document.getElementById('visit-photo-preview');prev.src=this.photoData;prev.style.display='block';
    document.getElementById('visit-photo-btn').style.display='none';e.target.value='';App.showToast('图片已添加，点击AI扫描');
  },
  async scan(){
    const p=Store.getCurrentPet();if(!p)return;
    if(!this.photoData){App.showToast('请先上传病历照片');return}
    const st=document.getElementById('visit-scan-status');if(!st){App.showToast('页面元素缺失');return}
    st.style.display='block';st.style.background='var(--primary-bg)';st.textContent='🤖 AI正在识别病历内容...';
    App.showLoading('AI扫描病历中...');
    try{
      const r=await API.analyzeImage(this.photoData,Prompts.visitRecord(p));
      const data=API.parseJSON(r);
      if(!data){st.style.background='#FFF0F0';st.textContent='⚠️ 识别失败，请手动填写或重拍';App.hideLoading();return}
      const set=(id,val)=>{const el=document.getElementById(id);if(el&&val)el.value=val};
      set('visit-date',data.date);set('visit-hospital',data.hospital);set('visit-diagnosis',data.diagnosis);
      set('visit-medications',data.medications);set('visit-advice',data.advice);set('visit-next-date',data.nextDate);set('visit-weight',data.weight);
      st.style.background='var(--primary-bg)';st.textContent='✅ AI识别完成，请核对信息后保存';
      App.showToast('识别完成');
      this._healthUpdate=data.healthUpdate||'';
    }catch(e){st.style.background='#FFF0F0';st.textContent='⚠️ 扫描失败: '+e.message;App.showToast('扫描失败: '+e.message)}
    finally{App.hideLoading()}
  },
  save(){
    const p=Store.getCurrentPet();if(!p)return;
    const get=(id)=>{const el=document.getElementById(id);return el?el.value.trim():''};
    const date=get('visit-date');if(!date){App.showToast('请选择就诊日期');return}
    const hospital=get('visit-hospital');const diagnosis=get('visit-diagnosis');
    const medications=get('visit-medications');const advice=get('visit-advice');
    const nextDateEl=document.getElementById('visit-next-date');const nextDate=nextDateEl?nextDateEl.value||null:null;
    const weightEl=document.getElementById('visit-weight');const weight=weightEl&&weightEl.value?parseFloat(weightEl.value):null;
    const r={id:Store.genId('visit'),petId:p.id,type:'visit',date,name:diagnosis?`${hospital}就诊(${diagnosis})`:'就诊记录',nextDate,weight,hospital,diagnosis,medications,advice,photo:this.photoData,note:''};
    Store.saveHealthRecord(r);
    if(this._healthUpdate){let mh=p.medicalHistory||'';if(mh&&!mh.endsWith('; '))mh+='; ';mh+=this._healthUpdate;p.medicalHistory=mh;Store.savePet(p);Profile.renderPetList()}
    if(weight){p.weight=weight;Store.savePet(p);Profile.renderPetList()}
    HealthRecord.renderRecords();App.renderReminders();document.getElementById('modal-visit').classList.remove('active');App.showToast('就诊记录已保存');
    if(this._healthUpdate)App.showToast('病史已自动更新');
  }
};
window.VisitRecord=VisitRecord;
const App={
  init(){this.bindEvents();Profile.renderPetList();this.renderReminders();this.updateChatPetInfo();HealthRecord.init();VisitRecord.init();Consultation.init();FeedCalendar.init();GrowthAlbum.init();
    if(Store.getCurrentPet()){HealthRecord.renderAll();FeedCalendar.render();GrowthAlbum.render()}},
  bindEvents(){
    document.querySelectorAll('.nav-item').forEach(i=>{i.addEventListener('click',()=>this.switchPage(i.dataset.page))});
    document.querySelectorAll('.qa-card[data-page]').forEach(c=>{c.addEventListener('click',()=>{this.switchPage(c.dataset.page);if(c.dataset.page==='consultation')Consultation.checkAndStart()})});
    document.getElementById('btn-add-pet').addEventListener('click',()=>Profile.openAddModal());
    document.getElementById('btn-save-pet').addEventListener('click',()=>Profile.save());
    document.getElementById('btn-add-record').addEventListener('click',()=>HealthRecord.openAddModal());
    document.getElementById('btn-save-record').addEventListener('click',()=>HealthRecord.save());
    document.getElementById('btn-visit').addEventListener('click',()=>VisitRecord.openModal());
    document.getElementById('qa-products').addEventListener('click',()=>{this.openModal('modal-products');Products.renderLatest()});
    document.getElementById('btn-generate-products').addEventListener('click',()=>Products.generate());
    document.getElementById('qa-hospital').addEventListener('click',()=>this.openModal('modal-hospital'));
    document.getElementById('btn-search-hospital').addEventListener('click',()=>Hospital.search());
    document.getElementById('btn-settings').addEventListener('click',()=>this.showToast('API已内置，可直接使用'));
    document.querySelectorAll('[data-close]').forEach(b=>{b.addEventListener('click',()=>this.closeModal(b.dataset.close))});
    document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)this.closeModal(o.id)})})},
  switchPage(name){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));const pg=document.getElementById('page-'+name);if(pg)pg.classList.add('active');const ni=document.querySelector(`.nav-item[data-page="${name}"]`);if(ni)ni.classList.add('active');
    if(name==='consultation'){this.updateChatPetInfo();setTimeout(()=>{const c=document.getElementById('chat-messages');if(c)c.scrollTop=c.scrollHeight},100)}
    if(name==='calendar')FeedCalendar.render();
    if(name==='album')GrowthAlbum.render();
    if(name==='health')HealthRecord.renderAll();
    if(name==='dashboard'){Profile.renderPetList();this.renderReminders()}},
  updateChatPetInfo(){const p=Store.getCurrentPet();const el=document.getElementById('chat-pet-info');if(p)el.innerHTML=`<span class="selected">${Profile.getEmoji(p.type)} ${p.name}</span> · ${Store.calcAge(p.birthDate)} · ${p.weight||'?'}kg`;else el.textContent='请先选择宠物'},
  renderReminders(){const rs=HealthRecord.getReminders();const el=document.getElementById('reminder-list');if(rs.length===0){el.innerHTML='<div class="empty-state" style="padding:20px;font-size:13px;">暂无提醒</div>';return}
    el.innerHTML=rs.slice(0,5).map(r=>`<div class="reminder-card"><span class="icon">${r.emoji}</span><div class="info"><div class="title">${r.title}</div><div class="desc">${r.desc}</div></div></div>`).join('')},
  openModal(id){document.getElementById(id).classList.add('active')},
  closeModal(id){document.getElementById(id).classList.remove('active')},
  showLoading(t='AI思考中...'){document.getElementById('loading-text').textContent=t;document.getElementById('loading-overlay').classList.add('active')},
  hideLoading(){document.getElementById('loading-overlay').classList.remove('active')},
  showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),dur)}
};
// Add calcAgeByDate to Store
Store.calcAgeByDate=function(b,d){if(!b||!d)return'';const bd=new Date(b);const dd=new Date(d);const m=(dd.getFullYear()-bd.getFullYear())*12+(dd.getMonth()-bd.getMonth());if(dd.getDate()<bd.getDate())m--;if(m<12)return m+'月龄';const y=Math.floor(m/12);const r=m%12;return r>0?y+'岁'+r+'月':y+'岁'};
window.Diet=Diet;window.App=App;window.Profile=Profile;window.Store=Store;window.FeedCalendar=FeedCalendar;window.GrowthAlbum=GrowthAlbum;
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
